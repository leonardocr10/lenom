<section id="faq">
  <div class="container layout">
    <div appReveal>
      <app-eyebrow>DÚVIDAS FREQUENTES</app-eyebrow>
      <h2>Perguntas<br /><span>frequentes</span></h2>
      <div class="help">
        <div class="help-title">Ainda com dúvidas?</div>
        <p>Fale com nossa equipe e receba uma orientação personalizada para o seu projeto.</p>
        <a href="#contato">Falar no WhatsApp →</a>
      </div>
    </div>

    <div class="list" appReveal>
      @for (f of items; track f.q; let i = $index) {
        <div class="item" [class.open]="openIndex() === i">
          <button
            type="button"
            [id]="'faq-q-' + i"
            [attr.aria-expanded]="openIndex() === i"
            [attr.aria-controls]="'faq-a-' + i"
            (click)="toggle(i)"
          >
            {{ f.q }}
            <span class="icon" aria-hidden="true">+</span>
          </button>
          <div
            class="answer"
            role="region"
            [id]="'faq-a-' + i"
            [attr.aria-labelledby]="'faq-q-' + i"
          >
            <div class="clip">
              <p>{{ f.a }}</p>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
